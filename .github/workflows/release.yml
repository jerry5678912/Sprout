name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify tag and runtime versions
        shell: bash
        run: |
          VERSION="$(python sprout.py version | awk '{print $2}')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          python tests/distribution.py
          python sprout.py release-check
      - name: Build release artifacts
        run: |
          python sprout.py language-package
          python sprout.py vscode-package
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sprout-*.zip
            dist/sprout-language-*.vsix
